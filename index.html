<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monk Directory</title>
<meta name="theme-color" content="#2D5A4A">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Monk Directory">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#5B2D91;--purplebg:#E9DFF5;--lilac:#7E57B5;--lilacbg:#F3EEF9;--bg:#F4F5F2;--ink:#1B2430;--accent:#2D5A4A;--muted:#55606E;--border:#D5D9D3;--tint:#E6EFEB;--field:#9AA5A0;--faint:#6B7684;--err:#9B2C2C;--errbg:#FBEAEA}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.page{max-width:560px;margin:0 auto;padding:24px 20px 28px;display:flex;flex-direction:column;gap:18px;min-height:100vh;min-height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700}
h2{margin:0;font-size:19px;font-weight:700}
.today{font-size:15px;color:var(--muted);text-align:right}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-size:15px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.head{display:flex;align-items:center;gap:12px}
label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
input,select{width:100%;height:52px;border:2px solid var(--field);border-radius:12px;padding:0 14px;font-size:18px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #7FB3A0;outline-offset:1px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0}
.primary{height:54px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;width:100%}
.primary[disabled]{opacity:.6;cursor:default}
.secondary{height:54px;border:2px solid var(--field);border-radius:14px;background:#fff;color:var(--ink);font-size:18px;font-weight:600;width:100%}
.sbtn{width:52px;height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:#fff;border:1px solid var(--border);border-radius:14px}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.wide{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;background:#fff;border:1px solid var(--border);border-radius:16px;color:var(--ink);text-align:left;font-size:18px;font-weight:600}
.wide .ico{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.wide .chev{margin-left:auto;color:var(--muted);flex:none}
.wide .s{font-size:14px;font-weight:400;color:var(--muted)}
.cm{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cm.mine{background:var(--tint);border-color:#BCD3C9}
.cm .nm{font-size:17px;font-weight:700}
.cm .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
.cm .grid .k{font-size:12px;color:var(--muted)}
.cm .grid .v{font-size:16px;font-weight:600}
.cm .note{font-size:13px;color:var(--muted)}
.cm input,.cm textarea,.kv input{height:44px;font-size:16px;padding:0 10px;border-radius:10px;width:100%}
.cm textarea{height:auto;min-height:72px;padding:8px 10px;border:2px solid var(--field);border-radius:10px;font:inherit;font-size:16px;width:100%;resize:vertical}
.cm.ed .grid{grid-template-columns:repeat(2,1fr)}
.cm.ed .full{grid-column:1/-1}
.kv.ed{flex-direction:column;align-items:stretch;gap:8px}
.rm{height:44px;border:1px solid #E8B8B8;border-radius:12px;background:#fff;color:var(--err);font-size:16px;font-weight:600;padding:0 14px;align-self:flex-start}
.rm.armed{background:var(--errbg)}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #E3E6E1;font-size:17px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;min-width:0;padding:8px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:16px;color:var(--ink)}
.menu .ico{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.menu .t{font-size:15px;font-weight:600;line-height:1.2}
.menu .s{display:none}
.menu .chev{display:none}
.coming{padding:16px;display:flex;flex-direction:column;gap:12px}
.coming.bluebg{background:#E3EEF9;border-color:#BFD6EE}
.coming.bluebg .badge{background:#fff}
.coming.bluebg .sub,.coming.bluebg .ev .what{color:#3F4C5C}
.coming .hd{display:flex;align-items:baseline;justify-content:space-between}
.sub{font-size:14px;color:var(--muted)}
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0;color:var(--ink)}
.badge{width:48px;height:48px;border-radius:10px;background:var(--tint);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:none}
.badge span:first-child{font-size:11px;font-weight:600}
.badge span:last-child{font-size:19px;font-weight:700}
.ev .who{font-size:16px;font-weight:600}
.ev .what{font-size:14px;color:var(--muted)}
.ev .when{margin-left:auto;font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap}
.ev.fd{cursor:default}
.ev.fd .badge{background:#fff;color:var(--lilac)}
.ev.fd .who{color:var(--ink)}
.ev.fd .when{color:var(--lilac)}
.ev.fd.sol .badge{background:#fff;color:var(--purple)}
.ev.fd.sol .who{color:var(--purple)}
.ev.fd.sol .when{color:var(--purple)}
.rank{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--lilacbg);color:var(--lilac)}
.rank.sol{background:var(--purplebg);color:var(--purple)}
.dock{position:sticky;bottom:0;z-index:5;margin:auto -20px -28px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:var(--accent);border-top:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:68px;min-width:0;padding:6px 4px;background:#fff;border:0;border-radius:14px;color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.15;text-align:center}
.dock .ico{width:30px;height:30px;border-radius:9px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.phonecard{padding:14px 16px;display:flex;align-items:center;gap:12px}
.phonecard .tx{min-width:0;flex:1}
.phonecard .k{font-size:14px;color:var(--muted)}
.phonecard .v{font-size:20px;font-weight:700}
.phonecard a.call{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
.phonecard button{background:none;border:0;padding:8px 6px;color:var(--accent);font-size:14px;font-weight:600}
.seg{display:flex;gap:6px;padding:4px;background:#fff;border:2px solid var(--accent);border-radius:12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-size:16px;font-weight:700;color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
.prt{width:100%;border-collapse:collapse;background:#fff}
.prt td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:16px}
.prt td.d{white-space:nowrap;font-weight:700;width:1%}
.prt td.o{color:var(--muted)}
.prt tr.fe td.n{color:var(--purple)}
.prthead{display:none}
@media print{
  body{background:#fff}
  .topbar,.head,.noprint,.banner{display:none!important}
  .page{padding:0;max-width:none;min-height:0}
  .prthead{display:block;margin-bottom:10px}
  .prthead h1{font-size:22px;margin:0}
  .prt td{font-size:13px;padding:5px 6px}
}
.awaycard{background:#E3F1E8;border-color:#B4D5C0}
.awaycard .badge{background:#fff;color:#2D5A4A}
.awaycard .sub,.awaycard .ev .what,.awaycard .hint{color:#3F5A4D}
.ev.ab .when{color:#7A5A1E}
.ev.ab.now .when{color:#9B2C2C}
.abrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.abrow:first-of-type{border-top:0}
.abrow .tx{min-width:0;flex:1}
.abrow .t1{font-size:16px;font-weight:600}
.abrow .t2{font-size:14px;color:var(--muted)}
.abrow button{background:none;border:0;padding:8px 6px;color:var(--accent);font-size:14px;font-weight:600}
.abrow button.rm{color:var(--err)}
.abcard{padding:16px;display:flex;flex-direction:column;gap:6px}
.abcard .hd{display:flex;align-items:baseline;justify-content:space-between}
.tabs{display:flex;gap:6px;padding:4px;background:#fff;border:2px solid var(--accent);border-radius:12px}
.tabbtn{flex:1;min-height:44px;border:0;border-radius:9px;background:none;font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;padding:0 4px}
.tabbtn.on{background:var(--accent);color:#fff}
.fcard{padding:16px;display:flex;flex-direction:column;gap:12px;background:#E9DFF5;border-color:#D3C2EA}
.fcard .badge{background:#fff}
.fcard .sub,.fcard .ev .what,.fcard .hint{color:#4A3F5C}
.fcard .rank,.fcard .rank.sol{background:#fff}
.fcard .hd{display:flex;align-items:baseline;justify-content:space-between}
.month{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.jub{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#F6E9C8;color:#6B4E00;font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:14px;text-align:left;width:100%;color:var(--ink)}
.row .nm{font-size:18px;font-weight:600;line-height:1.25}
.row .meta{font-size:14px;color:var(--muted)}
.row .chev{margin-left:auto;color:var(--muted);flex:none}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.count{font-size:15px;font-weight:600;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--tint);color:var(--accent);font-size:14px;font-weight:600}
.facts{display:flex;flex-direction:column}
.facts>div{padding:12px 16px;border-bottom:1px solid #E3E6E1}
.facts>div:last-child{border-bottom:0}
.facts .k{font-size:14px;color:var(--muted)}
.facts .v{font-size:18px;font-weight:600}
.facts .v.none{font-weight:400;color:var(--faint)}
.facts .v small{font-weight:400;color:var(--muted);font-size:16px}
form.f{display:flex;flex-direction:column;gap:14px}
.two{display:flex;gap:10px}
.banner{padding:12px 14px;border-radius:12px;font-size:16px}
.banner.err{background:var(--errbg);color:var(--err);border:1px solid #E8B8B8}
.banner.ok{background:var(--tint);color:var(--accent);border:1px solid #BCD3C9;font-weight:600}
.center{padding:40px 10px;text-align:center;color:var(--muted)}
.extra{display:none}
.narrow{width:100%}
.home,.home-left{display:flex;flex-direction:column;gap:20px}
.home{flex:1}
</style>

<script>
(function () {
  'use strict';
  var TITLES = ['Abbot', 'Archbishop', 'Fr.', 'Br.', 'Nov.', 'Post.'];
  var STATUSES = ['Final Vows', 'Temporary Vows', 'Novice', 'Postulant'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var JUBILEES = [25, 50, 60, 70];

  /* Feast calendar. Ranks follow the Swiss-American Congregation 2026 ordo (the calendar
     Conception Abbey uses) and the US Church calendar. Dates work themselves out every year.
     Set to false if the Abbey keeps the Ascension on Thursday. */
  var ASCENSION_ON_SUNDAY = true;

  // Fixed-date solemnities. std = moved to the next day if it lands on a Sunday of Advent, Lent or Easter, or in Holy Week.
  var FIXED_SOL = [
    { m: 1, d: 1, name: 'Mary, Mother of God' },
    { m: 3, d: 19, name: 'St. Joseph, Spouse of Mary', joseph: true },
    { m: 3, d: 25, name: 'The Annunciation of the Lord' },
    { m: 3, d: 21, name: 'Passing of St. Benedict', note: 'Benedictine' },
    { m: 5, d: 10, name: 'Dedication of the Basilica', note: 'Abbey Basilica' },
    { m: 6, d: 24, name: 'Nativity of St. John the Baptist' },
    { m: 6, d: 29, name: 'Sts. Peter and Paul' },
    { m: 7, d: 11, name: 'St. Benedict, Abbot', note: 'Benedictine' },
    { m: 8, d: 15, name: 'The Assumption of Mary' },
    { m: 9, d: 29, name: 'Archangels Michael, Gabriel and Raphael', note: 'Abbey’s secondary patron' },
    { m: 11, d: 1, name: 'All Saints' },
    { m: 12, d: 8, name: 'The Immaculate Conception', note: 'Patron of the Abbey and Basilica' },
    { m: 12, d: 25, name: 'The Nativity of the Lord (Christmas)' }
  ];
  // Fixed-date feasts. lord = a feast of the Lord, which beats an ordinary Sunday.
  var FIXED_FEAST = [
    { m: 1, d: 25, name: 'Conversion of St. Paul' },
    { m: 2, d: 2, name: 'The Presentation of the Lord', lord: true },
    { m: 2, d: 10, name: 'St. Scholastica', note: 'Benedictine' },
    { m: 2, d: 22, name: 'Chair of St. Peter' },
    { m: 4, d: 25, name: 'St. Mark' },
    { m: 5, d: 3, name: 'Sts. Philip and James' },
    { m: 5, d: 14, name: 'St. Matthias' },
    { m: 5, d: 31, name: 'The Visitation of Mary' },
    { m: 7, d: 3, name: 'St. Thomas' },
    { m: 7, d: 22, name: 'St. Mary Magdalene' },
    { m: 7, d: 25, name: 'St. James' },
    { m: 8, d: 6, name: 'The Transfiguration of the Lord', lord: true },
    { m: 8, d: 10, name: 'St. Lawrence' },
    { m: 8, d: 24, name: 'St. Bartholomew' },
    { m: 9, d: 3, name: 'St. Gregory the Great', note: 'Benedictine' },
    { m: 9, d: 8, name: 'The Nativity of Mary' },
    { m: 9, d: 14, name: 'The Exaltation of the Holy Cross', lord: true },
    { m: 9, d: 21, name: 'St. Matthew' },
    { m: 10, d: 18, name: 'St. Luke' },
    { m: 10, d: 28, name: 'Sts. Simon and Jude' },
    { m: 11, d: 9, name: 'Dedication of the Lateran Basilica', lord: true },
    { m: 11, d: 11, name: 'St. Martin of Tours' },
    { m: 11, d: 30, name: 'St. Andrew' },
    { m: 12, d: 12, name: 'Our Lady of Guadalupe' },
    { m: 12, d: 26, name: 'St. Stephen, First Martyr' },
    { m: 12, d: 27, name: 'St. John, Apostle' },
    { m: 12, d: 28, name: 'The Holy Innocents' }
  ];

  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function easterDate(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    var hh = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    var l = (32 + 2 * e + 2 * i - hh - k) % 7, m = Math.floor((a + 11 * hh + 22 * l) / 451);
    var mo = Math.floor((hh + l - 7 * m + 114) / 31), da = ((hh + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  function advent1(y) { var d = new Date(y, 10, 27); return addDays(d, (7 - d.getDay()) % 7); }

  /* All solemnities and feasts that fall in calendar year y. */
  function feastsForYear(y) {
    var E = easterDate(y), A1 = advent1(y), out = [];
    function sundayOfSeason(d) {
      if (d.getDay() !== 0) return false;
      if (d >= A1 && d <= new Date(y, 11, 24)) return true;               // Advent
      if (d >= addDays(E, -46) && d < addDays(E, -7)) return true;         // Lent
      if (d >= addDays(E, 7) && d <= addDays(E, 49)) return true;          // Easter, through Pentecost
      return false;
    }
    function inHolyWeekOrOctave(d) { return d >= addDays(E, -7) && d <= addDays(E, 7); }
    function add(date, name, rank, note) { out.push({ date: date, name: name, rank: rank, note: note || '' }); }

    // Days already taken by the big moveable solemnities of the Lord (they outrank a saint's solemnity).
    var ASC_DAYS = ASCENSION_ON_SUNDAY ? 42 : 39;
    var lordDays = [E, addDays(E, ASC_DAYS), addDays(E, 49), addDays(E, 56), addDays(E, 63), addDays(E, 68)];
    function lordTaken(d) { return lordDays.some(function (x) { return sameDay(x, d); }); }

    FIXED_SOL.forEach(function (s) {
      var d = new Date(y, s.m - 1, s.d);
      if (s.joseph && d >= addDays(E, -7) && d < E) d = addDays(E, -8);   // St. Joseph in Holy Week: Saturday before Palm Sunday
      else if (sundayOfSeason(d)) d = addDays(d, 1);
      else if (inHolyWeekOrOctave(d)) d = addDays(E, 8);
      // Two solemnities pushed onto the same day: the one listed first yields to the next free day.
      // St. John the Baptist moves back a day (as the Church does); the others move forward.
      var step = s.name.indexOf('John the Baptist') >= 0 ? -1 : 1;
      while (lordTaken(d) || out.some(function (o) { return o.rank === 'sol' && sameDay(o.date, d); })) d = addDays(d, step);
      add(d, s.name, 'sol', s.note);
    });

    // (The Annunciation is listed before St. Benedict so a feast of the Lord keeps the day if both are moved.)
    // Moveable days (US calendar; Epiphany and Corpus Christi on Sundays)
    var epi = new Date(y, 0, 2); epi = addDays(epi, (7 - epi.getDay()) % 7);
    add(epi, 'The Epiphany of the Lord', 'sol');
    add(epi.getDate() >= 7 ? addDays(epi, 1) : addDays(epi, 7), 'The Baptism of the Lord', 'feast');
    add(E, 'Easter Sunday', 'sol');
    add(addDays(E, ASC_DAYS), 'The Ascension of the Lord', 'sol');
    add(addDays(E, 49), 'Pentecost', 'sol');
    add(addDays(E, 56), 'The Most Holy Trinity', 'sol');
    add(addDays(E, 63), 'Corpus Christi', 'sol');
    add(addDays(E, 68), 'The Most Sacred Heart of Jesus', 'sol');
    add(addDays(A1, -7), 'Christ the King', 'sol');
    var hf = new Date(y, 11, 25).getDay() === 0 ? new Date(y, 11, 30) : (function () { var d = new Date(y, 11, 26); return addDays(d, (7 - d.getDay()) % 7); })();
    add(hf, 'The Holy Family', 'feast');

    FIXED_FEAST.forEach(function (f) {
      var d = new Date(y, f.m - 1, f.d);
      if (d.getDay() === 0 && !(f.lord && !sundayOfSeason(d))) return;     // a Sunday takes precedence
      if (inHolyWeekOrOctave(d)) return;
      add(d, f.name, 'feast', f.note);
    });

    // If a feast shares a day with a solemnity or another entry, keep the higher one only.
    return out.filter(function (a) {
      return !out.some(function (b) { return b !== a && sameDay(a.date, b.date) && (b.rank === 'sol' && a.rank === 'feast'); });
    });
  }

  /* Solemnities and feasts from today through the next `days` days. */
  function upcomingFeasts(days) {

  function viewProfile(s) {
    var m = byRow(s.row);
    if (!m) return h('div', { class: 'narrow' }, header('Not found'), h('div', { class: 'center' }, 'This record is no longer in the list.'));
    return h('div', { class: 'narrow' }, header(fullName(m), 'MONK PROFILE'),
      h('div', { style: 'height:12px' }),
      state.flash ? h('div', { class: 'banner ok', role: 'status' }, state.flash) : null,
      h('div', { style: 'height:6px' }),
      h('div', null, m.status ? h('span', { class: 'chip' }, m.status) : null),
      h('div', { style: 'height:16px' }),
      h('button', { class: 'primary', onclick: function () { go('form', { row: m.row }); } }, icon('edit', 20), 'Edit this monk'),
      h('div', { style: 'height:16px' }),
      phoneCard(m),
      h('div', { style: 'height:16px' }),
      h('div', { class: 'card facts' },
        fact('Legal (baptismal) name', m.legal),
        fact('Age', m.dob ? String(yearsSince(m.dob)) : ''),
        fact('Date of birth', fmtDate(m.dob)),
        fact('Namesday', fmtMD(m.namesday)),
        fact('Ordination', fmtDate(m.ord), m.ord ? plural(yearsSince(m.ord), 'year') : ''),
        fact('Current assignment', m.assign)),
      h('div', { style: 'height:16px' }),
      absCard(m),
      h('div', { style: 'height:16px' }),
      asgCard(m));
  }
  function phoneCard(m) {
    var p = phoneFor(m);
    if (!state.extOK) return h('div', { class: 'card phonecard' }, h('div', { class: 'tx' }, h('div', { class: 'k' }, 'Phone'), h('div', { class: 'hint' }, 'Not turned on yet. The data service needs the new version.')));
    if (!p) return h('div', { class: 'card phonecard' }, h('div', { class: 'tx' }, h('div', { class: 'k' }, 'Phone'), h('div', { class: 'hint' }, 'Not set')),
      h('button', { type: 'button', onclick: function () { go('phoneform', { row: m.row }); } }, 'Add number'));
    return h('div', { class: 'card phonecard' }, h('div', { class: 'tx' }, h('div', { class: 'k' }, 'Phone'), h('div', { class: 'v' }, p)),
      h('button', { type: 'button', onclick: function () { go('phoneform', { row: m.row }); } }, 'Edit'),
      h('a', { class: 'call', href: telOf(p) }, 'Call'));
  }
  function asgRange(a) {
    if (a.start && a.end) return fmtDate(a.start) + ' to ' + fmtDate(a.end);
    if (a.start) return 'Since ' + fmtDate(a.start);
    if (a.end) return 'Until ' + fmtDate(a.end);
    return a.end ? '' : 'Current, start date not recorded';
  }
  function asgCard(m) {
    var list = asgFor(m);
    var kids = [h('div', { class: 'hd' }, h('h2', null, 'Assignment history'),
      h('button', { class: 'linkbtn', onclick: function () { go('asgform', { row: m.row }); } }, 'Add assignment'))];
    if (!list.length) kids.push(h('div', { class: 'hint' }, 'None recorded.'));
    list.forEach(function (a) {
      kids.push(h('div', { class: 'abrow' },
        h('div', { class: 'tx' }, h('div', { class: 't1' }, a.assignment + (!a.end ? ' (current)' : '')), h('div', { class: 't2' }, asgRange(a))),
        h('button', { type: 'button', onclick: function () { go('asgform', { row: m.row, id: a.id }); } }, 'Edit'),
        h('button', { type: 'button', class: 'rm', onclick: function () {
          if (!window.confirm('Remove "' + a.assignment + '" from the history?')) return;
          api('deleteAssignment', { id: a.id }).then(function (res) {
            if (res && res.ok) { state.assigns = res.assignments || []; lsPut('monkAsg', state.assigns); state.flash = 'Removed.'; render(true); }
            else { state.notice = (res && res.error) || 'Could not remove it.'; render(); }
          }).catch(function () { state.notice = NET_ERR; render(); });
        } }, 'Remove')));
    });
    return h('div', { class: 'card abcard' }, kids);
  }
  function absCard(m) {
    var list = absFor(m);
    var kids = [h('div', { class: 'hd' }, h('h2', null, 'Absences'),
      h('button', { class: 'linkbtn', onclick: function () { go('absform', { row: m.row }); } }, 'Add absence'))];
    if (!state.absOK) kids.push(h('div', { class: 'hint' }, 'Absences are not turned on yet. The data service needs the new version.'));
    else if (!list.length) kids.push(h('div', { class: 'hint' }, 'None recorded.'));
    list.forEach(function (a) {
      var now = absNow(a);
      kids.push(h('div', { class: 'abrow' },
        h('div', { class: 'tx' }, h('div', { class: 't1' }, a.type + (now ? ' (away now)' : '')), h('div', { class: 't2' }, 'Leaves ' + fmtDate(a.start) + ', back ' + fmtDate(a.end))),
        h('button', { type: 'button', onclick: function () { go('absform', { row: m.row, id: a.id }); } }, 'Edit'),
        h('button', { type: 'button', class: 'rm', onclick: function () {
          if (!window.confirm('Remove this ' + a.type.toLowerCase() + ' (' + absRange(a) + ')?')) return;
          api('deleteAbsence', { id: a.id }).then(function (res) {
            if (res && res.ok) { state.absences = res.absences || []; absCachePut(state.absences); state.flash = 'Absence removed.'; render(true); }
            else { state.notice = (res && res.error) || 'Could not remove it.'; render(); }
          }).catch(function () { state.notice = NET_ERR; render(); });
        } }, 'Remove')));
    });
    return h('div', { class: 'card abcard' }, kids);
  }

  function field(id, labelText, control) {
    return h('div', null, h('label', { for: id }, labelText), control);
  }
  function selectEl(id, opts, value, blank) {
    var s = h('select', { id: id });
    if (blank !== undefined) s.appendChild(h('option', { value: '' }, blank));
    opts.forEach(function (o) {
      var val = typeof o === 'object' ? o.v : o, txt = typeof o === 'object' ? o.t : o;
      s.appendChild(h('option', { value: val }, txt));
    });
    s.value = value || '';
    return s;
  }
  function viewForm(s) {
    var m = s.row ? byRow(s.row) : null;
    var editing = !!m;
    if (s.row && !m) return h('div', { class: 'narrow' }, header('Not found'), h('div', { class: 'center' }, 'This record is no longer in the list.'));
    m = m || { title: '', monastic: '', last: '', legal: '', status: '', dob: '', namesday: '', first: '', solemn: '', ord: '', assign: '' };
    var orig = editing ? { monastic: m.monastic, last: m.last } : null;
    var nsM = m.namesday ? m.namesday.split('-')[0] : '', nsD = m.namesday ? String(+m.namesday.split('-')[1]) : '';
    var days = []; for (var d = 1; d <= 31; d++) days.push(String(d));
    var months = MONTHS_LONG.map(function (n, i) { var mm = ('0' + (i + 1)).slice(-2); return { v: mm, t: n }; });
    var t = today();
    var maxDob = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);

    var fTitle = selectEl('f-title', TITLES, m.title, 'No title');
    var fMon = h('input', { id: 'f-mon', type: 'text', value: m.monastic, autocomplete: 'off', maxlength: 80 });
    var fLast = h('input', { id: 'f-last', type: 'text', value: m.last, autocomplete: 'off', maxlength: 80 });
    var fLegal = h('input', { id: 'f-legal', type: 'text', value: m.legal, placeholder: 'Leave blank if unknown', autocomplete: 'off', maxlength: 120 });
    var fStatus = selectEl('f-status', STATUSES, m.status, 'Choose a status');
    var fDob = h('input', { id: 'f-dob', type: 'date', value: m.dob, min: '1700-01-01', max: maxDob });
    var fNsM = selectEl('f-nsm', months, nsM, 'Month');
    var fNsD = selectEl('f-nsd', days, nsD, 'Day');
    var fOrd = h('input', { id: 'f-ord', type: 'date', value: m.ord, min: '1700-01-01', max: '2100-12-31' });
    var fAssign = h('input', { id: 'f-assign', type: 'text', value: m.assign, placeholder: 'Leave blank if none', autocomplete: 'off', maxlength: 200 });

    var errBox = h('div', { class: 'banner err', role: 'alert', style: 'display:none' });
    var saveBtn = h('button', { class: 'primary', type: 'submit' }, editing ? 'Save changes' : 'Add this monk');
    function showErr(msg) { errBox.textContent = msg; errBox.style.display = msg ? 'block' : 'none'; if (msg) errBox.scrollIntoView({ block: 'center' }); }

    var form = h('form', { class: 'f', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      showErr('');
      if (!fMon.value.trim()) { showErr('Please enter the monastic name.'); fMon.focus(); return; }
      if (!fLast.value.trim()) { showErr('Please enter the last name.'); fLast.focus(); return; }
      if (!fStatus.value) { showErr('Please choose a status.'); fStatus.focus(); return; }
      if ((fNsM.value && !fNsD.value) || (!fNsM.value && fNsD.value)) { showErr('For the namesday, choose both a month and a day, or leave both empty.'); return; }
      var ns = fNsM.value ? fNsM.value + '-' + ('0' + fNsD.value).slice(-2) : '';
      var payload = { title: fTitle.value, monastic: fMon.value, last: fLast.value, legal: fLegal.value, status: fStatus.value,
        dob: fDob.value, namesday: ns, first: m.first || '', solemn: m.solemn || '', ord: fOrd.value, assign: fAssign.value };
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      var resetBtn = function () { saveBtn.disabled = false; saveBtn.textContent = editing ? 'Save changes' : 'Add this monk'; };
      api('save', { payload: payload, row: s.row || null, orig: orig }).then(function (res) {
        if (res && res.code === 'auth') { state.loaded = false; render(); return; }
        if (!res || !res.ok) { resetBtn(); showErr((res && res.error) || 'Could not save.'); return; }
        state.monks = res.monks.map(prep);
        cachePut(state.monks);
        state.stack.pop();
        if (!editing) { state.stack = [{ v: 'home' }]; }
        else { while (cur().v !== 'profile' && state.stack.length > 1) state.stack.pop(); }
        state.stack.push({ v: 'profile', row: res.row });
        state.flash = editing ? 'Saved.' : 'Added to the directory.';
        render(true);
      }).catch(function () { resetBtn(); showErr(NET_ERR); });
    } },
      errBox,
      field('f-title', 'Title', fTitle),
      field('f-mon', 'Monastic name', fMon),
      field('f-last', 'Last name', fLast),
      field('f-legal', 'Legal (baptismal) name', fLegal),
      field('f-status', 'Status', fStatus),
      field('f-dob', 'Date of birth', fDob),
      h('div', null, h('label', { for: 'f-nsm' }, 'Namesday (month and day)'), h('div', { class: 'two' }, fNsM, fNsD)),
      field('f-ord', 'Ordination', fOrd),
      field('f-assign', 'Current assignment', fAssign),
      h('div', { class: 'hint' }, 'Leave a date empty if it isn’t known. Age and years are worked out automatically.'),
      h('div', { style: 'display:flex;flex-direction:column;gap:10px;margin-top:4px' },
        saveBtn, h('button', { class: 'secondary', type: 'button', onclick: back }, 'Cancel')));

    return h('div', { class: 'narrow' }, header(editing ? fullName(m) : 'Add a monk', editing ? 'EDIT MONK' : 'NEW RECORD'),
      h('div', { style: 'height:16px' }), form);
  }

  function viewPass() {
    var inp = h('input', { id: 'pc', type: 'password', autocomplete: 'current-password', autocapitalize: 'none', autocorrect: 'off' });
    var msg = h('div', { class: 'banner err', role: 'alert', style: state.passMsg ? '' : 'display:none' }, state.passMsg);
    return h('div', { class: 'narrow' },
      h('form', { class: 'f', onsubmit: function (e) {
        e.preventDefault();
        var v = inp.value.trim();
        if (!v) { msg.textContent = 'Please type the passcode.'; msg.style.display = 'block'; return; }
        setPass(v); state.needPass = false; state.passMsg = ''; load();
      } },
        h('h1', null, 'Enter the passcode'),
        h('div', { class: 'hint' }, 'You only need to do this once on this phone or computer.'),
        msg,
        h('div', null, h('label', { for: 'pc' }, 'Passcode'), inp),
        h('button', { class: 'primary', type: 'submit' }, 'Open the directory')));
  }

  /* ---------- render ---------- */
  function render(scrollTop) {
    app.innerHTML = '';
    var page = h('div', { class: 'page' });
    var t = today();
    var onHome = cur().v === 'home';
    page.appendChild(h('div', { class: 'topbar' },
      h('div', { class: 'brand' },
        h('div', { class: 'logo' }, icon('cross')),
        h('div', null, h('div', { class: 'eyebrow' }, 'CONCEPTION ABBEY'), onHome ? h('h1', null, 'Monk Directory') : h('div', { style: 'font-weight:700;font-size:18px' }, 'Monk Directory')))));

    if (!configured()) {
      page.appendChild(h('div', { class: 'banner err', role: 'alert' }, 'This page is not connected to the directory yet. The link in config.js still needs to be filled in.'));
    } else if (state.needPass) {
      page.appendChild(viewPass());
    } else if (state.error) {
      page.appendChild(h('div', { class: 'banner err', role: 'alert' }, state.error));
      page.appendChild(h('button', { class: 'secondary', onclick: function () { load(); } }, 'Try again'));
    } else if (!state.loaded) {
      page.appendChild(h('div', { class: 'center' }, 'Loading the directory…'));
    } else {
      if (state.notice) page.appendChild(h('div', { class: 'banner err', role: 'status' }, state.notice));
      var s = cur(), body;
      if (s.v === 'results') body = viewResults(s);
      else if (s.v === 'all') body = viewAll(s);
      else if (s.v === 'upcoming') body = viewUpcoming(s);
      else if (s.v === 'feasts') body = viewFeasts(s);
      else if (s.v === 'away') body = viewAway(s);
      else if (s.v === 'print') body = viewPrint(s);
      else if (s.v === 'phoneform') body = viewPhoneForm(s);
      else if (s.v === 'asgform') body = viewAsgForm(s);
      else if (s.v === 'absform') body = viewAbsForm(s);
      else if (s.v === 'profile') body = viewProfile(s);
      else if (s.v === 'form') body = viewForm(s);
      else if (s.v === 'community') body = viewCommunity();
      else if (s.v === 'tab') body = viewTab(s);
      else body = viewHome();
      page.appendChild(body);
    }
    app.appendChild(page);
    if (scrollTop) window.scrollTo(0, 0);
  }

  window.__monkApp = { state: state, upcoming: upcoming, search: search };
  var cached = configured() ? cacheGet() : null;
  if (cached && cached.length) { state.monks = cached.map(prep); state.loaded = true; }
  render();
  state.absences = absCacheGet() || [];
  state.contacts = lsGet('monkCon') || [];
  state.assigns = lsGet('monkAsg') || [];
  load(null, true);
})();
</script>
</body>
</html>
